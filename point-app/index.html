<!-- index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ポイント送金アプリ</title>
</head>
<body>
    <h1>ポイント残高</h1>
    <ul id="user-list"></ul>

    <h2>送金する</h2>
    <label>送り主ID: <input type="number" id="sender" value="1"></label><br>
    <label>受取人ID: <input type="number" id="receiver" value="2"></label><br>
    <label>送付ポイント: <input type="number" id="amount" value="100"></label><br><br>
    <button onclick="sendPoints()">送金実行</button>

    <script>
        // サーバーのURL
        const API_URL = "http://localhost:8000";

        // ユーザー情報を取得して画面に表示する関数
        async function fetchUsers() {
            const response = await fetch(`${API_URL}/users`);
            const users = await response.json();
            
            const list = document.getElementById("user-list");
            list.innerHTML = ""; // 一旦クリア
            users.forEach(user => {
                const li = document.createElement("li");
                li.textContent = `ID:${user.id} ${user.name} - 残高: ${user.balance} pt`;
                list.appendChild(li);
            });
        }

        // 送金処理を行う関数
        async function sendPoints() {
            const sender = document.getElementById("sender").value;
            const receiver = document.getElementById("receiver").value;
            const amount = document.getElementById("amount").value;

            const response = await fetch(`${API_URL}/transfer`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    sender_id: parseInt(sender),
                    receiver_id: parseInt(receiver),
                    amount: parseInt(amount)
                })
            });

            const result = await response.json();
            if (response.ok) {
                alert(result.message);
                fetchUsers(); // 成功したら画面の残高を更新
            } else {
                alert("エラー: " + result.detail);
            }
        }

        // 画面が開かれたときに最初に実行
        fetchUsers();
    </script>
</body>
</html>
